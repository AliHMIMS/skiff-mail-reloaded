packages:
  - packages/libs/*
  - packages/web
  - packages/server
  - packages/mobile

# Single copies of the editor stack (two ProseMirror instances crash the composer)
overrides:
  # Vite minifies with Oxc; never install its optional Terser peer
  'terser': '-'
  '@keplr-wallet/types': '0.11.49'
  '@types/react': '^19.3.0'
  '@vvo/tzdb': '6.105.0'
  'bn.js': '5.2.1'
  # the versions @tiptap/pm 3 uses
  'prosemirror-changeset': '^2.4.4'
  'prosemirror-commands': '^1.7.2'
  'prosemirror-dropcursor': '^1.8.4'
  'prosemirror-gapcursor': '^1.4.1'
  'prosemirror-history': '^1.5.1'
  'prosemirror-inputrules': '^1.5.1'
  'prosemirror-keymap': '^1.2.3'
  'prosemirror-model': '^1.25.12'
  'prosemirror-schema-list': '^1.5.1'
  'prosemirror-state': '^1.4.4'
  'prosemirror-tables': '^1.8.5'
  'prosemirror-transform': '^1.12.2'
  'prosemirror-view': '^1.42.6'

# Only these packages may run install scripts
allowBuilds:
  # optional native builds / postinstall banners; all have JS fallbacks or prebuilt binaries
  '@parcel/watcher': false
  core-js: false
  keccak: false
  protobufjs: false
  secp256k1: false
  tiny-secp256k1: false
  zbase32: false
