packages:
  - libs/nightwatch-ui
  - libs/skiff-crypto
  - libs/skiff-crypto-v2
  - libs/skiff-front-graphql
  - libs/skiff-front-search
  - libs/skiff-front-utils
  - libs/skiff-graphql
  - libs/skiff-mail-protos
  - libs/skiff-utils
  - skemail-web

# Single copies of the editor stack (two ProseMirror instances crash the composer)
overrides:
  # Vite minifies with Oxc; never install its optional Terser peer
  'terser': '-'
  '@keplr-wallet/types': '0.11.49'
  '@tiptap/pm': '2.0.3'
  '@types/react': '^17.0.44'
  '@vvo/tzdb': '6.105.0'
  'bn.js': '5.2.1'
  'orderedmap': '2.1.1'
  'prosemirror-commands': '1.5.2'
  'prosemirror-dropcursor': '1.8.1'
  'prosemirror-gapcursor': '1.3.2'
  'prosemirror-history': '1.3.2'
  'prosemirror-inputrules': '1.2.1'
  'prosemirror-keymap': '1.2.2'
  'prosemirror-markdown': '1.11.0'
  'prosemirror-menu': '1.2.2'
  'prosemirror-model': '1.19.2'
  'prosemirror-schema-list': '1.3.0'
  'prosemirror-state': '1.4.3'
  'prosemirror-tables': '1.3.5'
  'prosemirror-transform': '1.7.3'
  'prosemirror-view': '1.32.4'

# Only these packages may run install scripts
allowBuilds:
  # optional native builds / postinstall banners; all have JS fallbacks or prebuilt binaries
  '@parcel/watcher': false
  core-js: false
  keccak: false
  protobufjs: false
  secp256k1: false
  tiny-secp256k1: false
